name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build CLI
        run: swift build --product gpnec
      - name: Test
        run: swift test
      - name: Build bridge (host arch)
        run: swift build -c release --product GPNECCBridge
